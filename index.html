<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Jovem Aprendiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Programa Jovem Aprendiz</h1>
            <p>Preencha os dados abaixo para se candidatar às nossas vagas.</p>
        </header>

        <form id="formulario">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <div class="input-group">
                <label for="mensagem">Por que você quer ser um Jovem Aprendiz?</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Fale um pouco sobre você..."></textarea>
            </div>

            <div class="input-group">
                <label for="curriculo">Link do Currículo (LinkedIn, Google Drive, etc.)</label>
                <input type="url" id="curriculo" name="curriculo" placeholder="https://seulink.com">
            </div>

            <button type="submit" id="btn-enviar">Enviar Cadastro</button>
            <p id="aviso"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
